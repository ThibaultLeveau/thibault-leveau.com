name: thibault-personal-site

services:
  site:
    image: local/thibault-personal-site:${IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    init: true
    environment:
      SITE_ENVIRONMENT: production
      SITE_STATIC_DIR: /app/build
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      SITE_LOG_LEVEL: ${SITE_LOG_LEVEL:-info}
      SITE_ADMIN_ENABLED: ${SITE_ADMIN_ENABLED:-false}
      SITE_ADMIN_USERNAME: ${SITE_ADMIN_USERNAME:-admin}
      SITE_ADMIN_PASSWORD: ${SITE_ADMIN_PASSWORD:-}
      SITE_SECRET_KEY: ${SITE_SECRET_KEY:-}
      SITE_ADMIN_ORIGIN: ${SITE_ADMIN_ORIGIN:-https://new.thibault-leveau.com}
      SITE_ADMIN_DB_PATH: /app/data/admin.sqlite3
      SITE_MEDIA_QUOTA_BYTES: ${SITE_MEDIA_QUOTA_BYTES:-1073741824}
      FORWARDED_ALLOW_IPS: 172.19.0.0/16
    read_only: true
    volumes:
      - admin_data:/app/data
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      egress:
        gw_priority: 1
      proxy:
        aliases:
          - thibault-personal-site
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  egress:
    driver: bridge
    internal: false
  proxy:
    external: true
    name: multisite_proxy

volumes:
  admin_data:
