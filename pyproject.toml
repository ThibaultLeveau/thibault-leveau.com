[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "thibault-personal-site"
version = "0.1.0"
description = "Site personnel de Thibault Leveau"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cryptography>=46,<49",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pillow>=12,<13",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10"]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/personal_site"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["personal_site"]
